function tone(n=0,len=.18){let c=audio();if(!c)return;let t=c.currentTime;let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=FREQUENCIES[n]||440;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(c.destination);o.start(t);o.stop(t+len+.02)}

function showTitle(){stopQte();data.node='title';save();setArt('cover');$('#ui').innerHTML=`<header><span class="brand">MIDNIGHT MUSIC ROOM</span><span class="edition">DEMO V${STORY_VERSION}</span><span class="grow"></span><button onclick="openOptions()">設定</button></header><main class="home"><div class="home-kicker">一首沒有結尾的樂曲，和不肯走向明天的你</div><h1>午夜十二點的<br>音樂教室</h1><div class="intro-text">同樣的星期五，再來一次。<br>這回你還會選擇相同的朋友嗎？</div><div class="home-actions"><button class="primary" onclick="initNew()">開始新的故事 <span>›</span></button><button onclick="resume()">繼續閱讀 <span>›</span></button><button onclick="openTree()">故事樹 <span>›</span></button><button onclick="openGallery()">結局・音樂收藏 <span>›</span></button></div><p class="home-foot">手機／平板觸控優化・所有劇情與角色圖離線可用<br>此為擴充劇情與系統的垂直切片，尚非完整的 1–2 小時路線。</p></main>`;}

 if(n.choices)choice=`<div class="choices">${n.choices.map((o,i)=>`<button class="choice" onclick="decision(N['${id}'].choices[${i}])"><b>${String(i+1).padStart(2,'0')}</b> ${esc(o.label)}</button>`).join('')}</div>`;
 else if(n.qte)choice=`<div class="choices"><button class="choice" onclick="startQte('${id}')"><b>♪</b> 開始事件｜${esc(n.qte.title)}</button></div>`;

function resultQte(id,pass,to){data.qteResults[id]=pass?'PASS':'MISS';data.flags.push(`qte_${id}_${pass?'pass':'miss'}`);closeOverlay();enter(to)}
function startRhythm(id,x){let n=0,hits=0,misses=0,t0=performance.now()+1200;const beats=Array.from({length:5},(_,i)=>t0+i*1050);qte={type:'rhythm',id,n,hits,misses,beats,done:false};
 overlay(`<div class="modal-header"><h2>♫ ${esc(x.title)}</h2><button onclick="qte?resultQte('${id}',false,'${x.fail}'):closeOverlay()">略過</button></div><p>看光點由右向左移動，在靠近金色判定線時敲擊。請跟上 5 個拍點，達成 3 次即可成功。</p><div class="qte-display"><div class="hitline"></div><div id="noteDot" class="notedot"></div></div><div id="qteStatus" class="qte-status">準備……</div><div class="tap-wrap"><button class="tapbutton" onclick="tapRhythm()">敲擊 ♪</button></div><p class="fine">節拍誤差不會直接結束遊戲，還可能走到不同的劇情。</p>`);
 function loop(){if(!qte||qte.type!=='rhythm'||qte.id!==id)return;const now=performance.now();while(qte.n<5&&now>qte.beats[qte.n]+(data.settings.assist?430:270)){qte.misses++;qte.n++;}if(qte.n===5)return finish();const dx=(qte.beats[qte.n]-now)/1200;let pos=Math.max(-5,Math.min(105,25+dx*70));const dot=$('#noteDot');if(dot)dot.style.left=pos+'%';let label=$('#qteStatus');if(label)label.textContent=`${qte.n+1} / 5　命中 ${qte.hits}　失誤 ${qte.misses}`;raf=requestAnimationFrame(loop)}
 function finish(){if(!qte||qte.done)return;qte.done=true;if(raf){cancelAnimationFrame(raf);raf=null}let pass=qte.hits>=3;const label=$('#qteStatus');if(label)label.textContent=pass?'節奏對上了！':'門牌順序改變了……';setTimeout(()=>{if(qte?.id===id)resultQte(id,pass,pass?x.pass:x.fail)},650)}
 window.tapRhythm=()=>{if(!qte||qte.id!==id||qte.done||qte.n>=5)return;let diff=Math.abs(performance.now()-qte.beats[qte.n]);const margin=data.settings.assist?430:270;if(diff<=margin){tone(qte.n%7,.14);qte.hits++;qte.n++;if(qte.n===5)finish()}else {let label=$('#qteStatus');if(label)label.textContent=diff>600?'再等等，光點還沒靠近！':'差一點，再試一次！'}};
 loop()}
function startMelody(id,x){qte={type:'melody',id,target:[0,2,4,2],pressed:[]};overlay(`<div class="modal-header"><h2>♪ ${esc(x.title)}</h2><button onclick="resultQte('${id}',false,'${x.fail}')">略過</button></div><p>先聆聽四個音，再用唱名音鍵依序重現。沒有絕對音感也可以玩。</p><button class="listen" onclick="playMotif()">▶ 聆聽旋律</button><div class="pianopads">${['Do','Re','Mi','Fa','Sol','La','Si'].map((name,i)=>`<button onclick="pressMelody(${i})">${name}</button>`).join('')}</div><div id="qteStatus" class="qte-status">已輸入 0 / 4</div><button class="soft" onclick="qte.pressed=[];$('#qteStatus').textContent='已清除，請再試一次'">重新輸入</button>`)}
function pressMelody(n){if(qte?.type!=='melody')return;tone(n);qte.pressed.push(n);let el=$('#qteStatus');if(el)el.textContent=`已輸入 ${qte.pressed.length} / 4`;if(qte.pressed.length>=4){let ok=qte.target.every((v,i)=>qte.pressed[i]===v),node=N[qte.id],id=qte.id;setTimeout(()=>resultQte(id,ok,ok?node.qte.pass:node.qte.fail),420)}}
function startTimed(id,x){qte={type:'timed',id,deadline:performance.now()+6000};let opts=x.options.map((o,i)=>`<button class="choice" onclick="timedPick('${id}',${i})"><b>${i+1}</b>${esc(o.label)}</button>`).join('');overlay(`<div class="modal-header"><h2>⏳ ${esc(x.title)}</h2><button onclick="resultQte('${id}',false,'${x.timeout}')">放棄選擇</button></div><p>你只有幾秒鐘決定，但沒有哪個選項可以保證完美。開啟輔助模式則不限制時間。</p><div class="countdown" id="countdown">${data.settings.assist?'∞':'6.0'}</div><div class="timertrack"><div id="timerfill"></div></div><div class="choices">${opts}</div>`);if(data.settings.assist)return;interval=setInterval(()=>{if(!qte||qte.id!==id)return;let rem=Math.max(0,(qte.deadline-performance.now())/1000);let clock=$('#countdown'),bar=$('#timerfill');if(clock)clock.textContent=rem.toFixed(1);if(bar)bar.style.width=(rem/6*100)+'%';if(rem===0)resultQte(id,false,x.timeout)},60)}
function timedPick(id,i){if(!qte||qte.id!==id)return;const o=N[id].qte.options[i];const op=C(o.label,o.to,o.delta);closeOverlay();decision(op)}
window.addEventListener('keydown',e=>{if(e.code==='Space'&&qte?.type==='rhythm'){e.preventDefault();tapRhythm()}});
window.addEventListener('pagehide',save);
load();if(data.node!=='title'&&data.node!=='ending'&&!N[data.node])data.node='title';if(data.node==='ending'&&data.lastEnd){endStory(data.lastEnd)}else if(N[data.node])render();else showTitle();

</script></body></html>
